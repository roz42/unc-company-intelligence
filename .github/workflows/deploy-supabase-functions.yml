name: Deploy UNC Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref vlxgfbdczpktuvxxrdqs --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes
          supabase functions deploy agent-chat --project-ref vlxgfbdczpktuvxxrdqs
          supabase functions deploy create-checkout --project-ref vlxgfbdczpktuvxxrdqs
          supabase functions deploy stripe-webhook --project-ref vlxgfbdczpktuvxxrdqs
          supabase functions deploy add-company-website --project-ref vlxgfbdczpktuvxxrdqs
